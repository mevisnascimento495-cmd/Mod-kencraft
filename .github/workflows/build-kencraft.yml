name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Locate KenCraft Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the repository root when it already contains the complete project.
          if [ -f "build.gradle" ] && [ -f "settings.gradle" ] && [ -f "gradle.properties" ] && [ -f "src/main/resources/META-INF/neoforge.mods.toml" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            echo "Using Gradle project from repository root."
            exit 0
          fi

          ZIP="$(find . -maxdepth 3 -type f -name 'KenCraft-Alpha-*-project.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No complete Gradle project found and no KenCraft project ZIP was found."
            exit 1
          fi

          rm -rf work
          mkdir -p work
          unzip -q "$ZIP" -d work

          BUILD_FILE="$(find work -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle/build.gradle.kts not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/META-INF/neoforge.mods.toml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using extracted project: $PROJECT_DIR"

      - name: Build KenCraft mod
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace

      - name: List generated JARs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-JAR
          path: ${{ steps.project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
