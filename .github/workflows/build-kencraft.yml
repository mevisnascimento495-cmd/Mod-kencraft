name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Materialize generated textures
        shell: bash
        run: |
          set -euo pipefail
          decode() {
            local source="$1"
            local target="$2"
            test -f "$source"
            mkdir -p "$(dirname "$target")"
            base64 -d "$source" > "$target"
            test "$(wc -c < "$target")" -gt 0
            file "$target"
          }
          decode src/main/resources/assets/kencraft/textures/item/jinsuikaku.png.b64 src/main/resources/assets/kencraft/textures/item/jinsuikaku.png
          decode src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png.b64 src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png
          decode src/main/resources/assets/kencraft/textures/entity/rinka.png.b64 src/main/resources/assets/kencraft/textures/entity/rinka.png
          decode src/main/resources/assets/kencraft/textures/entity/arf.png.b64 src/main/resources/assets/kencraft/textures/entity/arf.png
          decode src/main/resources/assets/kencraft/textures/entity/kikan.png.b64 src/main/resources/assets/kencraft/textures/entity/kikan.png

      - name: Verify complete project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/META-INF/neoforge.mods.toml
          test -f src/main/java/br/mevis/kencraft/KenCraft.java
          test -f src/main/resources/assets/kencraft/models/item/jinsuikaku_rank_c.json
          test -f src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png
          echo "KenCraft project found in repository root."

      - name: Build KenCraft mod
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace --refresh-dependencies

      - name: Explicitly create JAR
        shell: bash
        run: |
          set -euo pipefail
          gradle jar --no-daemon --stacktrace
          if gradle tasks --all --no-daemon | grep -Eq '^reobfJar$|[[:space:]]reobfJar[[:space:]]'; then
            echo "reobfJar task found; running it..."
            gradle reobfJar --no-daemon --stacktrace
          else
            echo "No reobfJar task; using normal jar output."
          fi

      - name: Find production JAR
        shell: bash
        run: |
          set -euo pipefail
          echo "=== All JARs under build ==="
          find build -type f -name '*.jar' -print | sort || true
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          if [ -z "$JAR" ]; then
            JAR="$(find build -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$JAR" ]; then
            echo "No JAR was produced after explicit jar/reobfJar tasks."
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" dist/kencraft-${GITHUB_SHA::7}.jar
          echo "Using JAR: $JAR"

      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-JAR
          path: dist/kencraft-*.jar
          if-no-files-found: error
          retention-days: 14
