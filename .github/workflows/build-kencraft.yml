name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main", "rinka-skin-fix"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Materialize generated textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          regular_files = [
              ("src/main/resources/assets/kencraft/textures/item/jinsuikaku.png.b64", "src/main/resources/assets/kencraft/textures/item/jinsuikaku.png"),
              ("src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png.b64", "src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png"),
              ("src/main/resources/assets/kencraft/textures/entity/arf.png.b64", "src/main/resources/assets/kencraft/textures/entity/arf.png"),
              ("src/main/resources/assets/kencraft/textures/entity/kikan.png.b64", "src/main/resources/assets/kencraft/textures/entity/kikan.png"),
          ]

          png_signature = b"\x89PNG\r\n\x1a\n"

          def decode(source_name: str, target_name: str, raw: str) -> None:
              raw = "".join(raw.split())
              data = base64.b64decode(raw, validate=True)
              if not data.startswith(png_signature):
                  raise SystemExit(f"Decoded file is not PNG: {source_name}")
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"OK: {target} ({len(data)} bytes)")

          for source_name, target_name in regular_files:
              source = Path(source_name)
              if not source.is_file():
                  raise SystemExit(f"Missing texture source: {source}")
              decode(source_name, target_name, source.read_text(encoding="utf-8"))

          new_rinka = Path("src/main/resources/assets/kencraft/textures/entity/rinka_new.png.b64")
          if not new_rinka.is_file():
              raise SystemExit(f"Missing replacement Rinka skin: {new_rinka}")
          decode(str(new_rinka), "src/main/resources/assets/kencraft/textures/entity/rinka.png", new_rinka.read_text(encoding="utf-8"))
          PY

      - name: Verify complete project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/META-INF/neoforge.mods.toml
          test -f src/main/java/br/mevis/kencraft/KenCraft.java
          test -f src/main/java/br/mevis/kencraft/event/JioSystem.java
          test -f src/main/java/br/mevis/kencraft/client/JioClientOverride.java
          test -f src/main/java/br/mevis/kencraft/client/JioAnimationState.java
          test -f src/main/resources/assets/kencraft/models/item/jinsuikaku_rank_c.json
          test -f src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png
          test -f src/main/resources/assets/kencraft/textures/entity/rinka.png
          test -f src/main/resources/assets/kencraft/textures/entity/arf.png
          if grep -q "RegisterCommandsEvent" src/main/java/br/mevis/kencraft/event/KenCraftJioCommand.java; then
            echo "Legacy Jio command registration is still active."
            exit 1
          fi
          echo "KenCraft project and rebuilt Jio subsystem verified."

      - name: Build KenCraft mod
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace --refresh-dependencies

      - name: Explicitly create JAR
        shell: bash
        run: |
          set -euo pipefail
          gradle jar --no-daemon --stacktrace
          if gradle tasks --all --no-daemon | grep -Eq '^reobfJar$|[[:space:]]reobfJar[[:space:]]'; then
            echo "reobfJar task found; running it..."
            gradle reobfJar --no-daemon --stacktrace
          else
            echo "No reobfJar task; using normal jar output."
          fi

      - name: Find production JAR
        shell: bash
        run: |
          set -euo pipefail
          echo "=== All JARs under build ==="
          find build -type f -name '*.jar' -print | sort || true
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          if [ -z "$JAR" ]; then
            JAR="$(find build -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$JAR" ]; then
            echo "No JAR was produced after explicit jar/reobfJar tasks."
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" dist/kencraft-${GITHUB_SHA::7}.jar
          echo "Using JAR: $JAR"

      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-JAR
          path: dist/kencraft-*.jar
          if-no-files-found: error
          retention-days: 14
