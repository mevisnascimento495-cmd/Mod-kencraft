name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Verify complete project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/META-INF/neoforge.mods.toml
          test -f src/main/java/br/mevis/kencraft/KenCraft.java
          test -f src/main/java/br/mevis/kencraft/client/KenCraftClient.java
          test -f src/main/java/br/mevis/kencraft/client/KenCraftScreen.java
          echo "KenCraft 0.5.0 project found in repository root."

      - name: Build KenCraft mod
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace

      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'modId = "kencraft"'
          echo "Generated: $JAR"

      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-0.5.0-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
