name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main", "java-skins-fix"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prepare textures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = [
            ("src/main/resources/assets/kencraft/textures/item/jinsuikaku.png.b64", "src/main/resources/assets/kencraft/textures/item/jinsuikaku.png"),
            ("src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png.b64", "src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png"),
            ("src/main/resources/assets/kencraft/textures/entity/kikan.png.b64", "src/main/resources/assets/kencraft/textures/entity/kikan.png"),
          ]
          sig = b"\x89PNG\r\n\x1a\n"
          for src, dst in files:
            data = base64.b64decode("".join(Path(src).read_text(encoding="utf-8").split()), validate=True)
            if not data.startswith(sig):
                raise SystemExit(f"Invalid PNG payload: {src}")
            Path(dst).write_bytes(data)
          PY
      - name: Verify skin PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          paths = [
            Path("src/main/resources/assets/kencraft/textures/entity/rinka.png"),
            Path("src/main/resources/assets/kencraft/textures/entity/arf.png"),
            Path("src/main/resources/assets/kencraft/textures/entity/shin_homare.png"),
            Path("src/main/resources/assets/kencraft/textures/entity/kaori_homare.png"),
          ]
          for path in paths:
            data = path.read_bytes()
            if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                raise SystemExit(f"Invalid PNG: {path}")
            w, h = struct.unpack(">II", data[16:24])
            if (w, h) != (64, 64):
                raise SystemExit(f"Skin must be 64x64: {path} -> {w}x{h}")
          PY
      - name: Verify complete project
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f src/main/resources/META-INF/neoforge.mods.toml
          test -f src/main/java/br/mevis/kencraft/KenCraft.java
          test -f src/main/java/br/mevis/kencraft/event/JioSystem.java
          test -f src/main/java/br/mevis/kencraft/client/JioClientOverride.java
          test -f src/main/java/br/mevis/kencraft/client/JioAnimationState.java
          test -f src/main/resources/assets/kencraft/models/item/jinsuikaku_rank_c.json
          test -f src/main/resources/assets/kencraft/textures/item/jinsuikaku_rank_c.png
          test -f src/main/resources/assets/kencraft/textures/entity/rinka.png
          test -f src/main/resources/assets/kencraft/textures/entity/arf.png
          test -f src/main/resources/assets/kencraft/textures/entity/shin_homare.png
          test -f src/main/resources/assets/kencraft/textures/entity/kaori_homare.png
          if grep -q "RegisterCommandsEvent" src/main/java/br/mevis/kencraft/event/KenCraftJioCommand.java; then exit 1; fi
      - name: Build KenCraft mod
        run: ./gradlew clean build --no-daemon --stacktrace --refresh-dependencies
      - name: Explicitly create JAR
        run: |
          set -euo pipefail
          ./gradlew jar --no-daemon --stacktrace
          if ./gradlew tasks --all --no-daemon | grep -Eq '^reobfJar$|[[:space:]]reobfJar[[:space:]]'; then ./gradlew reobfJar --no-daemon --stacktrace; fi
      - name: Find production JAR
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          if [ -z "$JAR" ]; then JAR="$(find build -type f -name '*.jar' -print -quit 2>/dev/null || true)"; fi
          test -n "$JAR"
          mkdir -p dist
          cp "$JAR" dist/kencraft-${GITHUB_SHA::7}.jar
      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-JAR
          path: dist/kencraft-*.jar
          if-no-files-found: error
          retention-days: 14
