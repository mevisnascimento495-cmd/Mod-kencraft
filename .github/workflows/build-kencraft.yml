name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify complete project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/META-INF/neoforge.mods.toml
          test -f src/main/java/br/mevis/kencraft/KenCraft.java
          test -f src/main/java/br/mevis/kencraft/client/KenCraftClient.java
          test -f src/main/java/br/mevis/kencraft/client/KenCraftScreen.java
          echo "KenCraft project found in repository root."

      - name: Build KenCraft mod
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace --refresh-dependencies

      - name: Diagnose Gradle outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== JAR files anywhere under build ==="
          find build -type f -name '*.jar' -print | sort || true
          echo "=== Relevant Gradle tasks ==="
          gradle tasks --all --no-daemon | grep -Ei '(^| )jar|reobf|assemble|build' | head -80 || true
          echo "=== build directory ==="
          find build -maxdepth 3 -type f | sort | head -200 || true

      - name: Ensure production JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit 2>/dev/null || true)"

          if [ -z "$JAR" ]; then
            echo "No JAR in build/libs. Checking for a reobfuscation task..."
            if gradle tasks --all --no-daemon | grep -Eq '^reobfJar|[[:space:]]reobfJar[[:space:]]'; then
              echo "Running reobfJar..."
              gradle reobfJar --no-daemon --stacktrace
            fi
            JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$JAR" ]; then
            echo "No production JAR found in build/libs."
            echo "Available JARs:"
            find build -type f -name '*.jar' -print | sort || true
            exit 1
          fi

          mkdir -p dist
          cp "$JAR" dist/kencraft-${GITHUB_SHA::7}.jar
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'modId = "kencraft"'
          echo "Production JAR: $JAR"
          echo "Artifact copy: dist/kencraft-${GITHUB_SHA::7}.jar"

      - name: Upload KenCraft Alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-JAR
          path: dist/kencraft-*.jar
          if-no-files-found: error
          retention-days: 14
