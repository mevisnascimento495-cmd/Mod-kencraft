plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = minecraft_version
    }

    runs {
        client {
            client()
            systemProperty('neoforged.enabledGameTestNamespaces', mod_id)
        }
        server {
            server()
            systemProperty('neoforged.enabledGameTestNamespaces', mod_id)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDirs += 'src/main/generated'
}

// Replace the ${...} placeholders in neoforge.mods.toml with the
// values from gradle.properties before the resources are packed into the JAR.
tasks.named('processResources', ProcessResources).configure {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            loader_version: loader_version,
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_authors: mod_authors,
            mod_description: mod_description
        )
    }

    // The Homare skin PNGs are supplied as Minecraft 64x64 skins with a
    // black editor background. Remove only the border-connected black area
    // after resources are copied, preserving black pixels that belong to the
    // actual character. This fixes the runtime model without changing the
    // artwork itself.
    doLast {
        def root = destinationDir.toPath().resolve('assets').resolve(mod_id).resolve('textures').resolve('entity').toFile()
        ['shin_homare.png', 'kaori_homare.png'].each { fileName ->
            def file = new File(root, fileName)
            if (!file.isFile()) return

            def image = javax.imageio.ImageIO.read(file)
            if (image == null || image.width != 64 || image.height != 64) {
                throw new GradleException("Invalid Homare skin PNG: ${file}")
            }

            def argb = new int[64][64]
            def visited = new boolean[64][64]
            def queue = new ArrayDeque<int[]>()
            for (int x = 0; x < 64; x++) {
                queue.add([x, 0] as int[])
                queue.add([x, 63] as int[])
            }
            for (int y = 0; y < 64; y++) {
                queue.add([0, y] as int[])
                queue.add([63, y] as int[])
            }

            while (!queue.isEmpty()) {
                def p = queue.removeFirst()
                int x = p[0]
                int y = p[1]
                if (visited[x][y]) continue
                visited[x][y] = true

                int color = image.getRGB(x, y)
                int a = (color >>> 24) & 0xFF
                int r = (color >>> 16) & 0xFF
                int g = (color >>> 8) & 0xFF
                int b = color & 0xFF

                if (a == 0 || Math.max(r, Math.max(g, b)) <= 12) {
                    argb[x][y] = 0x00000000
                    if (x > 0) queue.add([x - 1, y] as int[])
                    if (x < 63) queue.add([x + 1, y] as int[])
                    if (y > 0) queue.add([x, y - 1] as int[])
                    if (y < 63) queue.add([x, y + 1] as int[])
                }
            }

            def output = new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 64; y++) {
                for (int x = 0; x < 64; x++) {
                    if (argb[x][y] == 0) {
                        output.setRGB(x, y, image.getRGB(x, y))
                    } else {
                        output.setRGB(x, y, argb[x][y])
                    }
                }
            }
            if (!javax.imageio.ImageIO.write(output, 'PNG', file)) {
                throw new GradleException("Could not write processed Homare skin PNG: ${file}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
