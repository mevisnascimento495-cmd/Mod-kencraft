plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = minecraft_version
    }

    runs {
        client {
            client()
            systemProperty('neoforged.enabledGameTestNamespaces', mod_id)
        }
        server {
            server()
            systemProperty('neoforged.enabledGameTestNamespaces', mod_id)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def kenCraftSkinSourceDir = file('src/main/skins')
def kenCraftDecodedSkinResources = layout.buildDirectory.dir('generated/ken-craft-skins')

tasks.register('decodeKenCraftSkins') {
    inputs.dir(kenCraftSkinSourceDir)
    outputs.dir(kenCraftDecodedSkinResources)
    doLast {
        def outputDir = kenCraftDecodedSkinResources.get().asFile
        delete(outputDir)
        fileTree(kenCraftSkinSourceDir).matching { include '*.png.b64' }.files.each { source ->
            def imageName = source.name.substring(0, source.name.length() - 4)
            def target = new File(outputDir, "assets/kencraft/textures/entity/${imageName}")
            target.parentFile.mkdirs()
            target.bytes = java.util.Base64.getMimeDecoder().decode(source.text)
        }
    }
}

sourceSets.main.resources {
    srcDirs += 'src/main/generated'
    srcDirs += kenCraftDecodedSkinResources
}

// Replace the ${...} placeholders in neoforge.mods.toml with the
// values from gradle.properties before the resources are packed into the JAR.
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('decodeKenCraftSkins')
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            loader_version: loader_version,
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_authors: mod_authors,
            mod_description: mod_description
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
