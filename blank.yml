name: Build KenCraft Alpha

on:
  workflow_dispatch:
  push:
    branches: ["principal"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Find KenCraft project ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f -name 'KenCraft-Alpha-*-project.zip' -print -quit)"

          if [ -z "${ZIP}" ]; then
            echo "ERROR: KenCraft-Alpha-*-project.zip not found in the repository."
            exit 1
          fi

          echo "ZIP=${ZIP}"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Extract KenCraft project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.locate.outputs.zip }}" -d work

          echo "Extracted project files:"
          find work -maxdepth 4 -type f | sort | head -200

      - name: Locate Gradle project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find work -type f -name 'build.gradle' -print -quit)"

          if [ -z "${BUILD_FILE}" ]; then
            BUILD_FILE="$(find work -type f -name 'build.gradle.kts' -print -quit)"
          fi

          if [ -z "${BUILD_FILE}" ]; then
            echo "ERROR: build.gradle or build.gradle.kts was not found inside the ZIP."
            echo "The ZIP must contain a complete NeoForge Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${BUILD_FILE}")"
          echo "Project root: ${PROJECT_DIR}"

          test -f "${PROJECT_DIR}/settings.gradle" || test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/gradle.properties"
          test -f "${PROJECT_DIR}/src/main/resources/META-INF/neoforge.mods.toml"

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Build KenCraft mod
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          gradle clean build --no-daemon --stacktrace

      - name: Show generated JARs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: KenCraft-Alpha-build
          path: ${{ steps.project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
